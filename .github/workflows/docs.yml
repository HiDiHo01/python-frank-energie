name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned documentation generator
        run: python -m pip install --requirement requirements-docs.txt
      - name: Build site from repository documentation
        run: |
          zensical build --clean
          test -s site/index.html
          test -s site/getting-started/index.html
          test -s site/ARCHITECTURE/index.html
          test -s site/privacy-policy/index.html
      - name: Verify contributor instruction exclusion
        run: |
          python - <<'PY'
          """Check the real site and an isolated recursive exclusion fixture."""
          import json
          import shutil
          import subprocess
          import tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote, urlsplit

          instruction_names = ("AGENTS.md", "AI_POLICY.md")
          excluded_stems = {Path(name).stem.casefold() for name in instruction_names}
          probe_marker = "ContributorExclusionProbeUnique"
          control_route = "exclusion-check/level-two/public-control/"

          def is_instruction_route(location: str) -> bool:
              """Identify instruction page paths, not legitimate prose references."""
              path = PurePosixPath(unquote(urlsplit(location).path))
              return any(PurePosixPath(part).stem.casefold() in excluded_stems for part in path.parts)

          def verify_site(site: Path, *, probe: bool = False) -> None:
              """Require populated indexes and reject instruction output at any depth."""
              files = [file for file in site.rglob("*") if file.is_file()]
              if any(is_instruction_route(file.relative_to(site).as_posix()) for file in files):
                  raise SystemExit("Contributor instruction file was published")
              search_text = (site / "search.json").read_text(encoding="utf-8")
              items = json.loads(search_text)["items"]
              locations = [item["location"] for item in items]
              sitemap_text = (site / "sitemap.xml").read_text(encoding="utf-8")
              sitemap_urls = [node.text or "" for node in ET.fromstring(sitemap_text).findall(".//{*}loc")]
              if not locations or not sitemap_urls:
                  raise SystemExit("Expected populated documentation search index and sitemap")
              if any(is_instruction_route(location) for location in locations + sitemap_urls):
                  raise SystemExit("Contributor instructions appear in search or sitemap")
              if probe:
                  verify_probe(site, files, search_text, sitemap_text)

          def verify_probe(site: Path, files: list[Path], search_text: str, sitemap_text: str) -> None:
              """Ensure recursive exclusion is not merely caused by ignoring unlisted pages."""
              if not (site / control_route / "index.html").is_file():
                  raise SystemExit("Nested public control page was not built")
              if control_route not in search_text or control_route not in sitemap_text:
                  raise SystemExit("Nested public control page is absent from search or sitemap")
              if probe_marker in search_text or probe_marker in sitemap_text:
                  raise SystemExit("Synthetic instruction content leaked into an index")
              if any(
                  probe_marker in file.read_text(encoding="utf-8")
                  for file in files
                  if file.suffix == ".html"
              ):
                  raise SystemExit("Synthetic instruction content leaked into HTML")

          verify_site(Path("site"))
          with tempfile.TemporaryDirectory(prefix="docs-exclusion-") as directory:
              project = Path(directory)
              shutil.copytree("docs", project / "docs")
              shutil.copy2("zensical.toml", project / "zensical.toml")
              for depth in ("", "exclusion-check", "exclusion-check/level-two"):
                  parent = project / "docs" / depth
                  parent.mkdir(parents=True, exist_ok=True)
                  for name in instruction_names:
                      (parent / name).write_text(f"# {probe_marker}\n", encoding="utf-8")
              control = project / "docs/exclusion-check/level-two/public-control.md"
              control.write_text("# Public control page\n", encoding="utf-8")
              subprocess.run(["zensical", "build", "--clean"], cwd=project, check=True, timeout=120)
              verify_site(project / "site", probe=True)
          print("Contributor instructions excluded from HTML, search and sitemap at all tested depths")
          PY
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify:
    name: Verify published documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Check public documentation URLs
        shell: bash
        env:
          SITE_URL: https://hidiho01.github.io/python-frank-energie/
        run: |
          set -euo pipefail
          pages=(
            ""
            "getting-started/"
            "ARCHITECTURE/"
            "authentication/"
            "rate-limits/"
            "extra-read-only-queries/"
            "smart-hvac/"
            "smart-pv/"
            "smart-pv-field-matrix/"
            "weighted-average-prices/"
            "contributing/"
            "privacy-policy/"
          )
          # Share one propagation window across all routes. A final sweep may
          # finish after the deadline, but every request has a 15-second cap.
          retry_deadline=$((SECONDS + 300))
          pending=("${pages[@]}")
          while true; do
            retry=()
            for page in "${pending[@]}"; do
              url="${SITE_URL}${page}"
              if status=$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --connect-timeout 5 --max-time 15 "$url"); then
                if [[ "$status" == "200" ]]; then
                  echo "HTTP 200: $url"
                  continue
                fi
                echo "HTTP $status: $url"
              else
                echo "Request failed: $url"
              fi
              retry+=("$page")
            done
            pending=("${retry[@]}")
            if (( ${#pending[@]} == 0 )); then
              exit 0
            fi
            remaining=$((retry_deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            sleep "$((remaining < 20 ? remaining : 20))"
          done
          for page in "${pending[@]}"; do
            echo "::error::Published page is not reachable: ${SITE_URL}${page}"
          done
          exit 1
