name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned documentation generator
        run: python -m pip install --requirement requirements-docs.txt
      - name: Build site from repository documentation
        run: |
          zensical build --clean
          test -s site/index.html
          test -s site/getting-started/index.html
          test -s site/ARCHITECTURE/index.html
          test -s site/privacy-policy/index.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify:
    name: Verify published documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Check public documentation URLs
        shell: bash
        env:
          SITE_URL: https://hidiho01.github.io/python-frank-energie/
        run: |
          set -euo pipefail
          pages=(
            ""
            "getting-started/"
            "ARCHITECTURE/"
            "authentication/"
            "rate-limits/"
            "extra-read-only-queries/"
            "smart-hvac/"
            "smart-pv/"
            "smart-pv-field-matrix/"
            "weighted-average-prices/"
            "contributing/"
            "privacy-policy/"
          )
          failed=0
          for page in "${pages[@]}"; do
            url="${SITE_URL}${page}"
            passed=false
            for attempt in 1 2 3; do
              if status=$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --connect-timeout 5 --max-time 15 "$url"); then
                if [[ "$status" == "200" ]]; then
                  echo "HTTP 200: $url"
                  passed=true
                  break
                fi
                echo "HTTP $status: $url (attempt $attempt/3)"
              else
                echo "Request failed: $url (attempt $attempt/3)"
              fi
              if [[ "$attempt" != "3" ]]; then
                sleep 10
              fi
            done
            if [[ "$passed" != "true" ]]; then
              echo "::error::Published page is not reachable: $url"
              failed=1
            fi
          done
          exit "$failed"
