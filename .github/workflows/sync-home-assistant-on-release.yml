name: Sync published library release to Home Assistant

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: home-assistant-dependency-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  propose-dependency-update:
    name: Open Home Assistant dependency update PR
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out published library source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v7.1.0
        with:
          python-version: '3.14'

      - name: Validate stable release tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from datetime import date
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d{4}\.\d{1,2}\.\d{1,2}", tag) is None:
              raise SystemExit(f"Unsupported stable library release tag: {tag!r}")
          version = tag[1:]
          date(*(int(value) for value in version.split(".")))
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if project["tool"]["poetry"]["version"] != version:
              raise SystemExit("The release tag does not match the library package version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Wait until this release is installable from PyPI
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/python-frank-energie/{version}/json"
          for attempt in range(1, 41):
              try:
                  with urlopen(url, timeout=15) as response:
                      package = json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      raise
              except URLError as error:
                  print(f"PyPI temporarily unavailable: {type(error.reason).__name__}")
              else:
                  if package.get("info", {}).get("version") == version and any(
                      file.get("filename", "").endswith(".whl") and not file.get("yanked", False)
                      for file in package.get("urls", [])
                  ):
                      print(f"PyPI wheel verified for python-frank-energie=={version}")
                      break
              if attempt == 40:
                  raise SystemExit(f"PyPI did not publish a usable wheel for {version}")
              time.sleep(15)
          PY

      - name: Create narrowly scoped GitHub App token for the integration
        id: integration_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # @v2
        with:
          app-id: ${{ vars.HA_DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.HA_DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: HiDiHo01
          repositories: home-assistant-frank_energie
          permission-contents: write
          permission-pull-requests: write

      - name: Check out Home Assistant integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          repository: HiDiHo01/home-assistant-frank_energie
          ref: main
          path: integration
          token: ${{ steps.integration_token.outputs.token }}
          persist-credentials: false

      - name: Prepare a release-specific PR branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.integration_token.outputs.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd integration
          branch="automation/python-frank-energie-$PACKAGE_VERSION"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          existing="$(gh pr list --repo HiDiHo01/home-assistant-frank_energie \
            --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "A dependency PR already exists: #$existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --track -c "$branch" "origin/$branch"
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          else
            git switch -c "$branch"
          fi

      - name: Update only matching dependency declarations
        id: update
        if: steps.branch.outputs.skip != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/sync_home_assistant_dependency.py \
            --root integration --version "$PACKAGE_VERSION"
          git -C integration diff --check
          if git -C integration diff --quiet -- \
            custom_components/frank_energie/manifest.json pyproject.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and validate the Poetry lockfile
        if: steps.update.outputs.changed == 'true' || steps.branch.outputs.recovered == 'true'
        working-directory: integration
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'poetry==2.5.1'
          poetry update python-frank-energie --lock
          poetry check --lock
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("poetry.lock").open("rb") as source:
              lock = tomllib.load(source)
          versions = [
              item["version"]
              for item in lock["package"]
              if item["name"] == "python-frank-energie"
          ]
          if versions != [os.environ["PACKAGE_VERSION"]]:
              raise SystemExit(f"Unexpected library version in Poetry lockfile: {versions}")
          PY
          git diff --check

      - name: Commit and open dependency pull request
        if: steps.update.outputs.changed == 'true' || steps.branch.outputs.recovered == 'true'
        working-directory: integration
        env:
          GH_TOKEN: ${{ steps.integration_token.outputs.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom_components/frank_energie/manifest.json pyproject.toml poetry.lock
          git diff --cached --check
          gh auth setup-git
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update python-frank-energie to $PACKAGE_VERSION"
            git push --set-upstream origin "$UPDATE_BRANCH"
          fi
          cat > "$RUNNER_TEMP/dependency-pr.md" <<EOF
          ## Published upstream library release

          Update \`python-frank-energie\` to **$PACKAGE_VERSION** following [$RELEASE_URL]($RELEASE_URL).

          - Update the Home Assistant runtime pin in \`manifest.json\`.
          - Update the Poetry constraint in \`pyproject.toml\`.
          - Regenerate \`poetry.lock\` with Poetry 2.5.1, targeting only this dependency.
          - Preserve the integration's separate release \`version\`.

          The workflow verified that PyPI serves a non-yanked wheel for the new version and that the lockfile resolves that exact version.

          **Review required:** Verify client API compatibility (especially Smart HVAC/site references), Python 3.14 and Home Assistant tests, Ruff/Flake8, HACS and hassfest. Do not merge automatically. AI-assisted workflow implementation; maintainer approval is required.
          EOF
          gh pr create \
            --repo HiDiHo01/home-assistant-frank_energie \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "chore(deps): update python-frank-energie to $PACKAGE_VERSION" \
            --body-file "$RUNNER_TEMP/dependency-pr.md"
