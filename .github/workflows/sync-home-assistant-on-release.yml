name: Sync published library release to Home Assistant

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: home-assistant-dependency-releases
  queue: max
  cancel-in-progress: false

jobs:
  propose-dependency-update:
    name: Open Home Assistant dependency update PR
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_REPO: HiDiHo01/home-assistant-frank_energie

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # @v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            github-releases.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out trusted library automation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v7.1.0
        with:
          python-version: '3.14'

      - name: Validate stable release tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from datetime import date
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d{4}\.\d{1,2}\.\d{1,2}", tag, flags=re.ASCII) is None:
              raise SystemExit(f"Unsupported stable library release tag: {tag!r}")
          raw_version = tag[1:]
          release_parts = tuple(int(value) for value in raw_version.split("."))
          date(*release_parts)
          version = ".".join(str(value) for value in release_parts)
          tag_commit = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if tag_commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("The release tag no longer points to the published commit")
          subprocess.run(["git", "merge-base", "--is-ancestor", tag_commit, "HEAD"], check=True)
          project_text = subprocess.run(
              ["git", "show", f"{tag_commit}:pyproject.toml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          project = tomllib.loads(project_text)
          declared = project["tool"]["poetry"]["version"]
          if tuple(int(value) for value in declared.split(".")) != release_parts:
              raise SystemExit("The release tag does not match the tagged library package version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Wait for a verified published wheel on PyPI
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          version = os.environ["PACKAGE_VERSION"]
          metadata_url = "https://pypi.org/pypi/python-frank-energie/json"
          for attempt in range(1, 41):
              try:
                  with urlopen(metadata_url, timeout=15) as response:
                      package = json.load(response)
              except HTTPError as error:
                  if error.code not in (404, 408, 425, 429) and not 500 <= error.code < 600:
                      raise
                  print(f"Waiting for PyPI metadata (HTTP {error.code})")
              except (URLError, TimeoutError) as error:
                  print(f"Waiting for PyPI connection: {type(error).__name__}")
              else:
                  release_files = package.get("releases", {}).get(version, [])
                  if any(
                      file.get("filename", "").endswith(".whl") and not file.get("yanked", False)
                      for file in release_files
                  ):
                      print(f"Verified non-yanked wheel for python-frank-energie=={version}")
                      break
              if attempt == 40:
                  raise SystemExit(f"PyPI did not publish a non-yanked wheel for {version}")
              time.sleep(15)
          PY
          python -m pip download --disable-pip-version-check \
            --index-url https://pypi.org/simple/ --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP" "python-frank-energie==$PACKAGE_VERSION"

      - name: Create narrowly scoped GitHub App token for the integration
        id: integration_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # @v2
        with:
          app-id: ${{ vars.HA_DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.HA_DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: HiDiHo01
          repositories: home-assistant-frank_energie
          permission-contents: write
          permission-pull-requests: write

      - name: Check out Home Assistant integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          repository: HiDiHo01/home-assistant-frank_energie
          ref: main
          fetch-depth: 0
          path: integration
          token: ${{ steps.integration_token.outputs.token }}
          persist-credentials: false

      - name: Inspect pending PRs and any previously pushed release branch
        id: branch
        working-directory: integration
        env:
          GH_TOKEN: ${{ steps.integration_token.outputs.token }}
          APP_SLUG: ${{ steps.integration_token.outputs.app-slug }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="automation/python-frank-energie-$PACKAGE_VERSION"
          printf 'name=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          pending="$(gh api --paginate "repos/$GH_REPO/pulls?state=open&base=main&per_page=100" \
            | jq -r --arg repo "$GH_REPO" \
              '.[] | select(.head.repo.full_name == $repo) | [.number, .head.ref, .user.login] | @tsv')"
          existing_pr=
          superseded=()
          while IFS=$'\t' read -r pr_number pr_branch pr_author; do
            if [[ "$pr_branch" == "$branch" && "$pr_author" != "${APP_SLUG}[bot]" ]]; then
              echo "Release branch is already in use by PR #$pr_number."
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$pr_author" != "${APP_SLUG}[bot]" ||
              ! "$pr_branch" =~ ^automation/python-frank-energie-([0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2})$ ]]; then
              continue
            fi
            open_version="${BASH_REMATCH[1]}"
            if [[ "$open_version" == "$PACKAGE_VERSION" ]]; then
              existing_pr="$pr_number"
              continue
            fi
            latest="$(printf '%s\n%s\n' "$open_version" "$PACKAGE_VERSION" | sort -V | tail -n 1)"
            if [[ "$latest" == "$open_version" ]]; then
              echo "Newer dependency PR #$pr_number for $open_version already exists."
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            superseded+=("$pr_number")
          done <<< "$pending"
          printf 'superseded=%s\n' "$(IFS=,; echo "${superseded[*]}")" >> "$GITHUB_OUTPUT"
          if [[ -n "$existing_pr" ]]; then
            printf 'existing_pr=%s\n' "$existing_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git_with_auth=(git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential')
          if "${git_with_auth[@]}" ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            "${git_with_auth[@]}" fetch --no-tags origin "refs/heads/$branch"
            printf 'recovered_commit=%s\n' "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          elif [[ $? -ne 2 ]]; then
            echo 'Unable to query the authenticated downstream branch.' >&2
            exit 1
          fi

      - name: Prepare the dependency update from downstream main
        id: update
        if: steps.branch.outputs.skip != 'true' && steps.branch.outputs.existing_pr == ''
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          result="$(python scripts/sync_home_assistant_dependency.py \
            --root integration --version "$PACKAGE_VERSION" --prepare-lock)"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Refresh and verify the Poetry lockfile
        if: steps.update.outputs.result == 'updated'
        working-directory: integration
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'poetry==2.5.1'
          poetry lock --no-interaction
          poetry check --lock
          python ../scripts/sync_home_assistant_dependency.py \
            --root . --version "$PACKAGE_VERSION" --verify-lock

      - name: Prepare a commit without downstream credentials
        id: commit
        if: steps.update.outputs.result == 'updated'
        working-directory: integration
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RECOVERED_COMMIT: ${{ steps.branch.outputs.recovered_commit }}
        run: |
          set -euo pipefail
          paths=(custom_components/frank_energie/manifest.json pyproject.toml poetry.lock)
          git add -- "${paths[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi

          base_commit="$(git rev-parse HEAD)"
          bot_email='41898282+github-actions[bot]@users.noreply.github.com'
          parents=(-p "$base_commit")
          if [[ -n "$RECOVERED_COMMIT" ]] && ! git merge-base --is-ancestor "$RECOVERED_COMMIT" "$base_commit"; then
            fork_point="$(git merge-base "$base_commit" "$RECOVERED_COMMIT")"
            committers="$(git log --format=%ce "$base_commit..$RECOVERED_COMMIT" | sort -u)"
            if [[ "$committers" != "$bot_email" ]] || ! git diff --quiet "$fork_point" "$RECOVERED_COMMIT" -- . \
              ":(exclude)${paths[0]}" ":(exclude)${paths[1]}" ":(exclude)${paths[2]}"; then
              echo 'The release branch contains changes outside the dependency automation.' >&2
              exit 1
            fi
            parents+=(-p "$RECOVERED_COMMIT")
          fi

          if [[ -n "$RECOVERED_COMMIT" ]] && git merge-base --is-ancestor "$base_commit" "$RECOVERED_COMMIT" \
            && git diff --cached --quiet "$RECOVERED_COMMIT"; then
            commit="$RECOVERED_COMMIT"
          else
            git config --local user.name 'github-actions[bot]'
            git config --local user.email "$bot_email"
            # Keep a recovered branch's history so a retry can push without rewriting it.
            commit="$(git -c core.hooksPath=/dev/null commit-tree "$(git write-tree)" "${parents[@]}" \
              -m "chore(deps): update python-frank-energie to $PACKAGE_VERSION")"
          fi
          printf 'base=%s\nsha=%s\n' "$base_commit" "$commit" >> "$GITHUB_OUTPUT"

      - name: Publish dependency PR and close superseded automation PRs
        if: steps.commit.outputs.sha != '' || steps.branch.outputs.existing_pr != ''
        working-directory: integration
        env:
          GH_TOKEN: ${{ steps.integration_token.outputs.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          BASE_COMMIT: ${{ steps.commit.outputs.base }}
          UPDATE_COMMIT: ${{ steps.commit.outputs.sha }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
          EXISTING_PR: ${{ steps.branch.outputs.existing_pr }}
          SUPERSEDED_PRS: ${{ steps.branch.outputs.superseded }}
        run: |
          set -euo pipefail
          if [[ -n "$EXISTING_PR" ]]; then
            new_pr="https://github.com/$GH_REPO/pull/$EXISTING_PR"
          else
            current_main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$current_main" != "$BASE_COMMIT" ]]; then
              echo 'Downstream main changed while preparing the update. Rerun the workflow.' >&2
              exit 1
            fi
            git -c core.hooksPath=/dev/null -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push origin "$UPDATE_COMMIT:refs/heads/$UPDATE_BRANCH"
            cat > "$RUNNER_TEMP/dependency-pr.md" <<EOF
          ## Published upstream library release

          Update \`python-frank-energie\` to **$PACKAGE_VERSION** following [$RELEASE_URL]($RELEASE_URL).

          - Update the Home Assistant runtime pin in \`manifest.json\`.
          - Update the Poetry constraint in \`pyproject.toml\`.
          - Refresh \`poetry.lock\` with Poetry 2.5.1, retaining existing resolutions where compatible.
          - Preserve the integration's separate release \`version\`.

          The workflow verified that PyPI serves a non-yanked wheel for the new version and that the lockfile resolves that exact version.

          **Review required:** Verify client API compatibility (especially Smart HVAC/site references), Python 3.14 and Home Assistant tests, Ruff/Flake8, HACS and hassfest. Do not merge automatically. AI-assisted workflow implementation; maintainer approval is required.
          EOF
            new_pr="$(gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore(deps): update python-frank-energie to $PACKAGE_VERSION" \
              --body-file "$RUNNER_TEMP/dependency-pr.md")"
            echo "Created dependency pull request: $new_pr"
          fi

          if [[ -n "$SUPERSEDED_PRS" ]]; then
            IFS=, read -r -a old_pr_numbers <<< "$SUPERSEDED_PRS"
            for old_pr_number in "${old_pr_numbers[@]}"; do
              if [[ ! "$old_pr_number" =~ ^[0-9]+$ ]]; then
                echo "Invalid superseded PR number" >&2
                exit 1
              fi
              gh pr close "$old_pr_number" \
                --comment "Superseded by $new_pr (python-frank-energie==$PACKAGE_VERSION)."
            done
          fi
