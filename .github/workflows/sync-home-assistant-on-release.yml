name: Sync published library release to Home Assistant

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: home-assistant-dependency-releases
  cancel-in-progress: false

jobs:
  propose-dependency-update:
    name: Open Home Assistant dependency update PR
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            github-releases.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out trusted library automation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v7.1.0
        with:
          python-version: '3.14'

      - name: Validate stable release tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          import subprocess
          from datetime import date
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d{4}\.\d{1,2}\.\d{1,2}", tag) is None:
              raise SystemExit(f"Unsupported stable library release tag: {tag!r}")
          raw_version = tag[1:]
          release_parts = tuple(int(value) for value in raw_version.split("."))
          date(*release_parts)
          version = ".".join(str(value) for value in release_parts)
          tag_commit = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", tag_commit, "HEAD"], check=True)
          project_text = subprocess.run(
              ["git", "show", f"{tag_commit}:pyproject.toml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          project = tomllib.loads(project_text)
          declared = project["tool"]["poetry"]["version"]
          if tuple(int(value) for value in declared.split(".")) != release_parts:
              raise SystemExit("The release tag does not match the tagged library package version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Wait for a verified published wheel on PyPI
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          version = os.environ["PACKAGE_VERSION"]
          metadata_url = "https://pypi.org/pypi/python-frank-energie/json"
          for attempt in range(1, 41):
              try:
                  with urlopen(metadata_url, timeout=15) as response:
                      package = json.load(response)
              except HTTPError as error:
                  if error.code not in (404, 408, 425, 429) and not 500 <= error.code < 600:
                      raise
                  print(f"Waiting for PyPI metadata (HTTP {error.code})")
              except URLError as error:
                  print(f"Waiting for PyPI connection: {type(error.reason).__name__}")
              else:
                  release_files = package.get("releases", {}).get(version, [])
                  if any(
                      file.get("filename", "").endswith(".whl") and not file.get("yanked", False)
                      for file in release_files
                  ):
                      print(f"Verified non-yanked wheel for python-frank-energie=={version}")
                      break
              if attempt == 40:
                  raise SystemExit(f"PyPI did not publish a non-yanked wheel for {version}")
              time.sleep(15)
          PY
          python -m pip download --disable-pip-version-check \
            --index-url https://pypi.org/simple/ --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP" "python-frank-energie==$PACKAGE_VERSION"

      - name: Create narrowly scoped GitHub App token for the integration
        id: integration_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # @v2
        with:
          app-id: ${{ vars.HA_DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.HA_DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: HiDiHo01
          repositories: home-assistant-frank_energie
          permission-contents: write
          permission-pull-requests: write

      - name: Check out Home Assistant integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          repository: HiDiHo01/home-assistant-frank_energie
          ref: main
          path: integration
          token: ${{ steps.integration_token.outputs.token }}
          persist-credentials: false

      - name: Prepare a release-specific PR branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.integration_token.outputs.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd integration
          git config --local core.hooksPath /dev/null
          gh auth setup-git
          branch="automation/python-frank-energie-$PACKAGE_VERSION"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          pending="$(gh pr list --repo HiDiHo01/home-assistant-frank_energie \
            --state open --limit 100 --json number,headRefName --jq '.[] | [.number, .headRefName] | @tsv')"
          superseded=()
          while IFS=

      - name: Update only matching dependency declarations
        id: update
        if: steps.branch.outputs.skip != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/sync_home_assistant_dependency.py \
            --root integration --version "$PACKAGE_VERSION"
          git -C integration diff --check
          locked_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("integration/poetry.lock").open("rb") as source:
              lock = tomllib.load(source)
          packages = [item["version"] for item in lock["package"] if item["name"] == "python-frank-energie"]
          if len(packages) != 1:
              raise SystemExit(f"Expected one locked python-frank-energie package, found {packages}")
          print(packages[0])
          PY
          )"
          if git -C integration diff --quiet -- \
            custom_components/frank_energie/manifest.json pyproject.toml \
            && [[ "$locked_version" == "$PACKAGE_VERSION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and validate the Poetry lockfile
        if: steps.update.outputs.changed == 'true' || steps.branch.outputs.recovered == 'true'
        working-directory: integration
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'poetry==2.5.1'
          poetry update python-frank-energie --lock
          poetry check --lock
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("poetry.lock").open("rb") as source:
              lock = tomllib.load(source)
          versions = [
              item["version"]
              for item in lock["package"]
              if item["name"] == "python-frank-energie"
          ]
          if versions != [os.environ["PACKAGE_VERSION"]]:
              raise SystemExit(f"Unexpected library version in Poetry lockfile: {versions}")
          PY
          git diff --check

      - name: Commit and open dependency pull request
        if: steps.update.outputs.changed == 'true' || steps.branch.outputs.recovered == 'true'
        working-directory: integration
        env:
          GH_TOKEN: ${{ steps.integration_token.outputs.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
          SUPERSEDED_PRS: ${{ steps.branch.outputs.superseded }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom_components/frank_energie/manifest.json pyproject.toml poetry.lock
          git diff --cached --check
          gh auth setup-git
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(deps): update python-frank-energie to $PACKAGE_VERSION"
            git -c core.hooksPath=/dev/null push --set-upstream origin "$UPDATE_BRANCH"
          fi
          cat > "$RUNNER_TEMP/dependency-pr.md" <<EOF
          ## Published upstream library release

          Update \`python-frank-energie\` to **$PACKAGE_VERSION** following [$RELEASE_URL]($RELEASE_URL).

          - Update the Home Assistant runtime pin in \`manifest.json\`.
          - Update the Poetry constraint in \`pyproject.toml\`.
          - Regenerate \`poetry.lock\` with Poetry 2.5.1, targeting only this dependency.
          - Preserve the integration's separate release \`version\`.

          The workflow verified that PyPI serves a non-yanked wheel for the new version and that the lockfile resolves that exact version.

          **Review required:** Verify client API compatibility (especially Smart HVAC/site references), Python 3.14 and Home Assistant tests, Ruff/Flake8, HACS and hassfest. Do not merge automatically. AI-assisted workflow implementation; maintainer approval is required.
          EOF
          new_pr="$(gh pr create \
            --repo HiDiHo01/home-assistant-frank_energie \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "chore(deps): update python-frank-energie to $PACKAGE_VERSION" \
            --body-file "$RUNNER_TEMP/dependency-pr.md")"
          echo "Created dependency pull request: $new_pr"

          if [[ -n "$SUPERSEDED_PRS" ]]; then
            IFS=, read -r -a old_pr_numbers <<< "$SUPERSEDED_PRS"
            for old_pr_number in "${old_pr_numbers[@]}"; do
              if [[ ! "$old_pr_number" =~ ^[0-9]+$ ]]; then
                echo "Invalid superseded PR number" >&2
                exit 1
              fi
              gh pr close "$old_pr_number" \
                --repo HiDiHo01/home-assistant-frank_energie \
                --comment "Superseded by $new_pr (python-frank-energie==$PACKAGE_VERSION)."
            done
          fi
\t' read -r pr_number pr_branch; do
            if [[ "$pr_branch" =~ ^automation/python-frank-energie-([0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2})$ ]]; then
              open_version="${BASH_REMATCH[1]}"
              if [[ "$open_version" == "$PACKAGE_VERSION" ]]; then
                echo "A dependency PR already exists: #$pr_number"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              latest="$(printf '%s\n%s\n' "$open_version" "$PACKAGE_VERSION" | sort -V | tail -n 1)"
              if [[ "$latest" == "$open_version" ]]; then
                echo "Newer dependency PR #$pr_number for $open_version already exists; skipping older release."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              superseded+=("$pr_number")
            fi
          done <<< "$pending"
          printf 'superseded=%s\n' "$(IFS=,; echo "${superseded[*]}")" >> "$GITHUB_OUTPUT"

          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null
          remote_status=$?
          set -e
          if [[ "$remote_status" -eq 0 ]]; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --track -c "$branch" "origin/$branch"
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          elif [[ "$remote_status" -eq 2 ]]; then
            git switch -c "$branch"
          else
            echo "Unable to query the authenticated downstream branch (git status $remote_status)" >&2
            exit 1
          fi

      - name: Update only matching dependency declarations
        id: update
        if: steps.branch.outputs.skip != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/sync_home_assistant_dependency.py \
            --root integration --version "$PACKAGE_VERSION"
          git -C integration diff --check
          locked_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("integration/poetry.lock").open("rb") as source:
              lock = tomllib.load(source)
          packages = [item["version"] for item in lock["package"] if item["name"] == "python-frank-energie"]
          if len(packages) != 1:
              raise SystemExit(f"Expected one locked python-frank-energie package, found {packages}")
          print(packages[0])
          PY
          )"
          if git -C integration diff --quiet -- \
            custom_components/frank_energie/manifest.json pyproject.toml \
            && [[ "$locked_version" == "$PACKAGE_VERSION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and validate the Poetry lockfile
        if: steps.update.outputs.changed == 'true' || steps.branch.outputs.recovered == 'true'
        working-directory: integration
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'poetry==2.5.1'
          poetry update python-frank-energie --lock
          poetry check --lock
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("poetry.lock").open("rb") as source:
              lock = tomllib.load(source)
          versions = [
              item["version"]
              for item in lock["package"]
              if item["name"] == "python-frank-energie"
          ]
          if versions != [os.environ["PACKAGE_VERSION"]]:
              raise SystemExit(f"Unexpected library version in Poetry lockfile: {versions}")
          PY
          git diff --check

      - name: Commit and open dependency pull request
        if: steps.update.outputs.changed == 'true' || steps.branch.outputs.recovered == 'true'
        working-directory: integration
        env:
          GH_TOKEN: ${{ steps.integration_token.outputs.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom_components/frank_energie/manifest.json pyproject.toml poetry.lock
          git diff --cached --check
          gh auth setup-git
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(deps): update python-frank-energie to $PACKAGE_VERSION"
            git -c core.hooksPath=/dev/null push --set-upstream origin "$UPDATE_BRANCH"
          fi
          cat > "$RUNNER_TEMP/dependency-pr.md" <<EOF
          ## Published upstream library release

          Update \`python-frank-energie\` to **$PACKAGE_VERSION** following [$RELEASE_URL]($RELEASE_URL).

          - Update the Home Assistant runtime pin in \`manifest.json\`.
          - Update the Poetry constraint in \`pyproject.toml\`.
          - Regenerate \`poetry.lock\` with Poetry 2.5.1, targeting only this dependency.
          - Preserve the integration's separate release \`version\`.

          The workflow verified that PyPI serves a non-yanked wheel for the new version and that the lockfile resolves that exact version.

          **Review required:** Verify client API compatibility (especially Smart HVAC/site references), Python 3.14 and Home Assistant tests, Ruff/Flake8, HACS and hassfest. Do not merge automatically. AI-assisted workflow implementation; maintainer approval is required.
          EOF
          gh pr create \
            --repo HiDiHo01/home-assistant-frank_energie \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "chore(deps): update python-frank-energie to $PACKAGE_VERSION" \
            --body-file "$RUNNER_TEMP/dependency-pr.md"
