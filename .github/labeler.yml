documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "requirements*.txt"
          - "pyproject.toml"
          - "poetry.lock"
          - "uv.lock"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

github-config:
  - changed-files:
      - all-globs-to-any-file:
          - ".github/**"
          - "!.github/workflows/**"

api:
  - changed-files:
      - any-glob-to-any-file:
          - "python_frank_energie/**"

# Apply the authentication label manually after reviewing the change.
# Automatic matching of shared Python modules is too broad.
